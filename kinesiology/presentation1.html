<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発表アンケート｜運動学実習 presentation1</title>

  <link rel="stylesheet" href="./css/style.css" />

  <style>
    .section-title {
      font-size: 18px;
      font-weight: bold;
      color: #1a5276;
      margin: 24px 0 8px;
      border-left: 5px solid #1a5276;
      padding-left: 10px;
    }

    .help-text {
      font-size: 13px;
      color: #666;
      margin: 4px 0 12px;
    }

    .form-row {
      margin-top: 16px;
    }

    .form-row label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    select,
    textarea,
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      background: #fff;
      box-sizing: border-box;
    }

    select:focus,
    textarea:focus,
    input[type="text"]:focus {
      border-color: #1a5276;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
      line-height: 1.6;
    }

    .eval-block {
      border: 1px solid #dde3ec;
      border-radius: 8px;
      padding: 16px;
      margin-top: 14px;
      background: #fbfcfe;
    }

    .eval-block h3 {
      font-size: 16px;
      color: #333;
      margin-bottom: 10px;
    }

    .required {
      color: #c0392b;
      font-size: 13px;
      margin-left: 4px;
    }

    .notice {
      background: #eaf0f8;
      border-left: 4px solid #1a5276;
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 14px;
      margin-top: 12px;
    }

    .error-message {
      color: #c0392b;
      font-weight: bold;
      margin-top: 12px;
      white-space: pre-line;
    }

    .submit-status {
      margin-top: 12px;
      font-weight: bold;
      white-space: pre-line;
    }

    .submit-status.sending {
      color: #1a5276;
    }

    .submit-status.error {
      color: #c0392b;
    }

    .success-message {
      color: #27ae60;
      font-weight: bold;
      text-align: center;
      margin-top: 16px;
      white-space: pre-line;
    }
  </style>

  <script src="./js/presentation1.js?v=48" defer></script>
</head>

<body>
  <header class="header">
    <h1>運動学実習 発表アンケート presentation1</h1>
    <p>筋力・重心動揺に関するグループ発表の相互評価</p>
  </header>

  <main class="container">
    <section class="card" id="form-card">
      <p class="notice">
        自分のグループ以外の3グループについて、筋力と重心動揺それぞれの感想を記入してください。
      </p>

      <div class="student-id-section form-row">
        <label for="student-id">
          1）学籍番号 <span class="required">必須</span>
        </label>
        <input
          type="text"
          id="student-id"
          placeholder="例：c251234のように、英字1文字＋数字6桁で入力してください。"
          autocomplete="off"
        />
      </div>

      <div class="form-row">
        <label for="own-group">
          自分のグループ <span class="required">必須</span>
        </label>
        <select id="own-group">
          <option value="">選択してください</option>
          <option value="Group1">Group1</option>
          <option value="Group2">Group2</option>
          <option value="Group3">Group3</option>
          <option value="Group4">Group4</option>
        </select>
      </div>

      <h2 class="section-title">2）筋力の感想</h2>
      <p class="help-text">
        自分のグループ以外の3グループを選び、それぞれ自由記載で感想を入力してください。
      </p>
      <div id="strength-section"></div>

      <h2 class="section-title">3）重心動揺の感想</h2>
      <p class="help-text">
        自分のグループ以外の3グループを選び、それぞれ自由記載で感想を入力してください。
      </p>
      <div id="cop-section"></div>

      <div id="error-message" class="error-message"></div>

      <button id="btn-submit" class="btn btn-primary" type="button">
        回答を送信する
      </button>

      <div id="submit-status" class="submit-status"></div>
    </section>

    <section class="card" id="thanks-card" style="display: none;">
      <h2 style="text-align: center; color: #1a5276;">送信完了</h2>
      <p class="success-message">
        回答を送信しました。ありがとうございました。
      </p>
      <a
        href="index.html"
        class="btn btn-success"
        style="text-align: center; text-decoration: none;"
      >
        トップページに戻る
      </a>
    </section>
  </main>
</body>
</html>
